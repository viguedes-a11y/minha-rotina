<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marmitas da Semana</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme:light;
  --verde:#1a3a2a; --verde-m:#2d5a3d; --verde-c:#4a7c5f;
  --dourado:#c9a84c; --dourado-c:#e8c97a;
  --creme:#f5f0e8; --creme-e:#e0d8c8; --branco:#fdfaf5;
  --texto:#1a2420; --texto-s:#6a7a70;
  --rosa:#d4756a; --azul:#5a8ab0;
  --c-proteina:#d4756a; --c-carbo:#c9a84c; --c-legume:#4a7c5f; --c-jantar:#5a8ab0; --c-lanche:#9a7aa0; --c-cafe:#a9845a; --c-petisco:#c0705a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--branco);color:var(--texto);min-height:100vh;overflow-x:hidden;}
button,input,select,textarea{font-family:'DM Sans',sans-serif;font-size:14px;color:var(--texto);}

/* HEADER */
.hdr{background:linear-gradient(165deg,#0f2219 0%,var(--verde-m) 100%);padding:40px 20px 30px;text-align:center;position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:24px;background:var(--branco);border-radius:24px 24px 0 0;}
.hdr-orb{position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.1) 0%,transparent 70%);top:-60px;left:50%;transform:translateX(-50%);pointer-events:none;}
.hdr-back{position:absolute;top:14px;left:14px;font-size:12px;color:var(--dourado);text-decoration:none;opacity:.85;}
.hdr-date{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dourado);margin-bottom:4px;opacity:.8;}
.hdr-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--creme);}
.hdr-title em{font-style:italic;color:var(--dourado-c);}
.hdr-sync{font-size:11px;color:var(--dourado-c);margin-top:6px;min-height:14px;}
.hdr-sum{font-size:12px;color:rgba(245,240,232,.65);margin-top:6px;}

/* CONTENT / TABS */
.content{max-width:720px;margin:0 auto;padding:6px 16px 100px;}
.tabs{display:flex;gap:7px;margin-bottom:18px;overflow-x:auto;padding:2px 0;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--branco);z-index:5;padding-top:10px;padding-bottom:8px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:20px;border:1.5px solid var(--creme-e);background:white;font-size:13px;color:var(--texto-s);cursor:pointer;white-space:nowrap;font-weight:500;}
.tab.active{background:var(--verde);border-color:var(--verde);color:var(--dourado);}

/* CARDS */
.card{background:var(--creme);border-radius:16px;padding:16px;margin-bottom:12px;}
.card.white{background:white;border:1px solid var(--creme-e);}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.card-t{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--verde);line-height:1.1;}
.card-s{font-size:12px;color:var(--texto-s);}
.sec-t{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--verde);margin:6px 2px 4px;}
.sec-s{font-size:12px;color:var(--texto-s);margin:0 2px 14px;line-height:1.5;}
.ml-auto{margin-left:auto;}
.muted{color:var(--texto-s);font-size:12px;}
.warn{background:rgba(212,117,106,.1);border:1px solid rgba(212,117,106,.3);color:#9a4a40;border-radius:10px;padding:8px 12px;font-size:12px;margin:8px 0;}
.ok{background:rgba(74,124,95,.1);border:1px solid rgba(74,124,95,.25);color:var(--verde-m);border-radius:10px;padding:8px 12px;font-size:12px;margin:8px 0;}
.empty{text-align:center;padding:30px 10px;color:var(--texto-s);font-size:13px;}

/* FORM */
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1.5px solid var(--creme-e);border-radius:10px;background:white;outline:none;min-width:0;}
.inp:focus{border-color:var(--verde-c);}
.inp.sm{width:72px;text-align:center;padding:7px 6px;}
.inp.xs{width:64px;flex:0 0 64px;text-align:center;padding:6px 4px;}
textarea.inp{min-height:80px;resize:vertical;line-height:1.5;}
.lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--texto-s);margin:10px 0 5px;display:block;}
.row{display:flex;gap:8px;align-items:center;}
.row.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.btn{padding:9px 16px;background:var(--verde);color:var(--dourado);border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;}
.btn.sec{background:white;color:var(--verde);border:1.5px solid var(--creme-e);}
.btn.ghost{background:transparent;color:var(--verde-c);border:1.5px dashed var(--creme-e);width:100%;}
.btn.danger{background:white;color:var(--rosa);border:1.5px solid rgba(212,117,106,.4);}
.btn.sm{padding:6px 11px;font-size:12px;}
.x{width:30px;height:30px;border-radius:50%;border:1px solid var(--creme-e);background:white;color:var(--texto-s);cursor:pointer;flex-shrink:0;font-size:14px;line-height:1;}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none;}
.switch input{width:18px;height:18px;accent-color:var(--verde);}

/* PEOPLE / COMBOS */
.avatar{width:40px;height:40px;border-radius:12px;background:white;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11px;padding:3px 9px;border-radius:12px;background:white;border:1px solid var(--creme-e);color:var(--texto-s);white-space:nowrap;}
.chip b{color:var(--texto);font-weight:600;}
.combo{background:white;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--creme-e);}
.combo-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.stepper{display:flex;align-items:center;border:1.5px solid var(--creme-e);border-radius:10px;overflow:hidden;}
.stepper button{width:32px;height:32px;border:none;background:var(--creme);cursor:pointer;font-size:16px;color:var(--verde);}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-size:14px;}
.sel-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dot.proteina{background:var(--c-proteina);} .dot.carbo{background:var(--c-carbo);} .dot.legume{background:var(--c-legume);} .dot.jantar{background:var(--c-jantar);} .dot.lanche{background:var(--c-lanche);} .dot.cafe{background:var(--c-cafe);} .dot.petisco{background:var(--c-petisco);}
.sel-row .k{font-size:11px;color:var(--texto-s);width:62px;flex-shrink:0;}
.sum-line{font-size:12px;margin-top:4px;}

/* CHECKLIST */
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--creme-e);cursor:pointer;}
.chk:last-child{border-bottom:none;}
.chk .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--creme-e);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:white;margin-top:1px;}
.chk.done .box{background:var(--verde-c);border-color:var(--verde-c);}
.chk.done .box::after{content:'✓';color:white;font-size:13px;font-weight:700;}
.chk .txt{flex:1;font-size:14px;line-height:1.4;}
.chk.done .txt{color:var(--texto-s);text-decoration:line-through;}
.chk .q{font-weight:600;color:var(--verde);white-space:nowrap;}
.chk .sub{font-size:11px;color:var(--texto-s);margin-top:2px;text-decoration:none;}
.ing-list{font-size:13px;line-height:1.7;columns:2;column-gap:16px;margin:6px 0 4px;}
.ing-list div{break-inside:avoid;}
.ing-list b{color:var(--verde);font-weight:600;}

/* TIMELINE */
.gantt{background:white;border:1px solid var(--creme-e);border-radius:14px;padding:12px 10px 8px;margin-bottom:12px;}
.g-lane{display:flex;align-items:center;height:30px;}
.g-name{width:74px;font-size:11px;color:var(--texto-s);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.g-track{position:relative;flex:1;height:22px;background:var(--creme);border-radius:6px;}
.g-bar{position:absolute;top:0;bottom:0;border-radius:6px;color:white;font-size:10px;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:22px;border:1px solid rgba(255,255,255,.6);}
.g-bar.proteina{background:var(--c-proteina);} .g-bar.carbo{background:var(--c-carbo);} .g-bar.legume{background:var(--c-legume);} .g-bar.jantar{background:var(--c-jantar);} .g-bar.lanche{background:var(--c-lanche);} .g-bar.cafe{background:var(--c-cafe);} .g-bar.petisco{background:var(--c-petisco);} .g-bar.montagem{background:var(--verde);}
.g-axis{display:flex;margin-left:74px;position:relative;height:16px;margin-top:4px;}
.g-tick{position:absolute;font-size:10px;color:var(--texto-s);transform:translateX(-50%);}
.tl-time{font-size:12px;font-weight:600;color:var(--verde);white-space:nowrap;min-width:92px;}
.tl-eq{font-size:11px;color:var(--texto-s);}

/* MONTAGEM */
.mt{width:100%;border-collapse:collapse;font-size:13px;}
.mt td,.mt th{padding:7px 4px;border-bottom:1px solid var(--creme-e);text-align:left;vertical-align:top;}
.mt th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--texto-s);font-weight:500;}
.mt td.n{text-align:right;white-space:nowrap;font-weight:600;color:var(--verde);}

/* RECIPES */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.fchip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--creme-e);background:white;font-size:12px;cursor:pointer;color:var(--texto-s);}
.fchip.active{background:var(--verde);border-color:var(--verde);color:var(--dourado);}
.grp-h{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--texto-s);margin:14px 2px 6px;}
.rcard{display:flex;align-items:center;gap:10px;background:white;border:1px solid var(--creme-e);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;}
.rcard .nm{font-size:14px;font-weight:500;}
.rcard .meta{font-size:11px;color:var(--texto-s);margin-top:2px;}
.ed-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.ed-row .inp{padding:7px 8px;}

.modal-bg{position:fixed;inset:0;background:rgba(15,34,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:900;}
.modal{background:var(--branco);border-radius:18px;padding:20px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
.modal p{font-size:14px;line-height:1.5;margin-bottom:14px;}
.modal textarea{min-height:160px;font-size:12px;}
.modal .row{justify-content:flex-end;margin-top:12px;}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--verde);color:var(--dourado);padding:10px 22px;border-radius:28px;font-size:13px;z-index:1000;transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
.toast.show{transform:translateX(-50%) translateY(0);}

@media (max-width:480px){
  .ing-list{columns:1;}
  .grid3{grid-template-columns:1fr 1fr;}
  .tl-time{min-width:80px;}
}
@media print{
  .tabs,.hdr,.btn,.no-print{display:none!important;}
  .card{break-inside:avoid;}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div id="modal"></div>

<div class="hdr">
  <div class="hdr-orb"></div>
  <a class="hdr-back" href="index.html">‹ Minha Rotina</a>
  <div class="hdr-date">planejamento semanal</div>
  <div class="hdr-title">Marmitas <em>da Semana</em></div>
  <div class="hdr-sum" id="hdrSum"></div>
  <div class="hdr-sync" id="syncInfo"></div>
</div>

<div class="content">
  <div class="tabs" id="tabs"></div>
  <div id="page"></div>
</div>

<script>
/* ============================================================
   CONSTANTES
   ============================================================ */
const KEY = 'marmitas_v1';
const COMP = ['proteina','carbo','legume'];
const TIPOS = {proteina:'Proteína', jantar:'Proteína · prato completo', carbo:'Carboidrato', legume:'Legumes', lanche:'Lanche', cafe:'Café da manhã', petisco:'Petisco'};
/* seções extras da semana: receitas que rendem unidades/porções */
const EXTRAS = [
  {tipo:'lanche',  chave:'lanches',  titulo:'Lanches da semana', plural:'Lanches',       emoji:'🥪', un:'un',      fundo:'rgba(154,122,160,.09)', add:'+ lanche'},
  {tipo:'cafe',    chave:'cafe',     titulo:'Café da manhã',     plural:'Café da manhã', emoji:'☕', un:'porções', fundo:'rgba(169,132,90,.10)',  add:'+ item do café'},
  {tipo:'petisco', chave:'petiscos', titulo:'Petiscos',          plural:'Petiscos',      emoji:'🧀', un:'porções', fundo:'rgba(192,112,90,.09)',  add:'+ petisco'},
];
const EXTRA = t => EXTRAS.find(x=>x.tipo===t);
const POR_UNIDADE = t => t==='jantar' || !!EXTRA(t);
const UNID = r => r.tipo==='jantar' ? 'porções' : EXTRA(r.tipo) ? EXTRA(r.tipo).un : 'g';
const NOME_TIPO = t => EXTRA(t) ? EXTRA(t).plural : TIPOS[t];
const EQUIP = {
  fogao:{nome:'Fogão', icon:'🔥'},
  airfryer:{nome:'Airfryer', icon:'💨'},
  forno:{nome:'Forno', icon:'♨️'},
  bancada:{nome:'Bancada', icon:'🔪'}
};
const UNIDADES = ['g','ml','un','dente','maço','colher (sopa)','colher (chá)','xícara','lata','caixa','pacote','a gosto'];
const SECOES = ['Açougue e peixaria','Hortifrúti','Frios, laticínios e ovos','Padaria','Mercearia','Outros'];
const PAGES = [
  ['semana','Semana'],['compras','Compras'],['vespera','Véspera'],
  ['preparo','Dia do preparo'],['receitas','Receitas'],['ajustes','Ajustes']
];

/* ============================================================
   RECEITAS PADRÃO
   ingredientes: [quantidade, unidade, nome]
   rende: gramas PRONTAS (proteína/carbo/legume) ou PORÇÕES (jantar)
   lote: capacidade da airfryer em g prontos por leva (opcional)
   ============================================================ */
function R(id,nome,tipo,rende,ing,pre,etapas,lote){
  return {id,nome,tipo,rende,lote:lote||0,
    ingredientes:ing.map(([qtd,un,nome])=>({qtd,un,nome,secao:''})),
    pre,etapas:etapas.map(([eq,min,txt])=>({eq,min,txt}))};
}
function receitasPadrao(){ return receitasBase().map(r=>r.id==='arroz_branco'?ARROZ_BRANCO_VI():r.id==='legumes_assados'?LEGUMES_FORNO_VI():r).concat(receitasVi(),receitasLanches(),receitasCafe(),receitasPetiscos(),receitasNovas5(),receitasNovas7()); }
function receitasBase(){ return [
  // PROTEÍNAS
  R('frango_cubos','Frango em cubos grelhado','proteina',700,
    [[1000,'g','peito de frango'],[3,'dente','alho'],[1,'un','limão'],[10,'g','sal'],[20,'ml','azeite'],[5,'g','páprica defumada']],
    ['Cortar o frango em cubos médios','Temperar com alho amassado, limão, sal e páprica e deixar marinando na geladeira'],
    [['fogao',25,'Grelhar em frigideira grande com azeite, em levas, sem amontoar']]),
  R('frango_af','Frango na airfryer','proteina',700,
    [[1000,'g','peito de frango'],[3,'dente','alho'],[1,'un','limão'],[10,'g','sal'],[10,'ml','azeite'],[5,'g','páprica defumada']],
    ['Cortar o frango em cubos ou tiras','Temperar e deixar marinando na geladeira'],
    [['airfryer',18,'Airfryer a 200 °C, sacudindo o cesto na metade']],500),
  R('carne_moida','Carne moída refogada (patinho)','proteina',750,
    [[1000,'g','patinho moído'],[1,'un','cebola'],[3,'dente','alho'],[2,'un','tomate'],[10,'g','sal'],[15,'ml','azeite'],[1,'maço','cheiro-verde']],
    ['Picar cebola, alho e tomate e guardar em pote fechado','Passar a carne do congelador para a geladeira'],
    [['fogao',25,'Dourar a carne em panela grande, juntar cebola, alho e tomate e refogar até secar']]),
  R('sobrecoxa_forno','Sobrecoxa assada sem osso','proteina',700,
    [[1000,'g','sobrecoxa sem osso'],[4,'dente','alho'],[1,'un','limão'],[10,'g','sal'],[5,'g','páprica doce'],[20,'ml','azeite']],
    ['Temperar e deixar marinando na geladeira de um dia para o outro'],
    [['forno',45,'Assar a 200 °C coberta com papel-alumínio por 25 min, depois descobrir e dourar']]),
  R('tilapia_af','Tilápia na airfryer','proteina',750,
    [[1000,'g','filé de tilápia'],[1,'un','limão'],[2,'dente','alho'],[8,'g','sal'],[10,'ml','azeite']],
    ['Passar os filés do congelador para a geladeira','Temperar com limão, alho e sal'],
    [['airfryer',15,'Airfryer a 200 °C (por leva)']],400),
  R('iscas_patinho','Iscas de patinho aceboladas','proteina',700,
    [[1000,'g','patinho em iscas'],[2,'un','cebola'],[3,'dente','alho'],[10,'g','sal'],[20,'ml','azeite']],
    ['Cortar a carne em tiras finas (ou pedir no açougue)','Fatiar as cebolas em meia-lua'],
    [['fogao',20,'Selar a carne em fogo alto, em levas, e finalizar com a cebola']]),
  R('frango_desfiado','Frango desfiado','proteina',750,
    [[1000,'g','peito de frango'],[1,'un','cebola'],[2,'dente','alho'],[2,'un','tomate'],[10,'g','sal'],[15,'ml','azeite']],
    ['Picar cebola, alho e tomate'],
    [['fogao',25,'Cozinhar o frango na panela de pressão com água e sal (15 min após pegar pressão)'],['bancada',10,'Desfiar o frango'],['fogao',10,'Refogar com cebola, alho e tomate']]),
  // CARBOIDRATOS
  R('arroz_branco','Arroz branco','carbo',1500,
    [[500,'g','arroz branco'],[1000,'ml','água'],[2,'dente','alho'],[15,'ml','óleo'],[8,'g','sal']],
    [],
    [['fogao',25,'Refogar o alho no óleo, juntar o arroz e a água fervente com sal; cozinhar tampado em fogo baixo']]),
  R('arroz_integral','Arroz integral','carbo',1400,
    [[500,'g','arroz integral'],[1250,'ml','água'],[2,'dente','alho'],[15,'ml','óleo'],[8,'g','sal']],
    ['Deixar o arroz de molho em água (opcional, acelera o cozimento)'],
    [['fogao',40,'Refogar o alho, juntar arroz e água fervente com sal; cozinhar tampado em fogo baixo']]),
  R('batata_doce_forno','Batata-doce assada','carbo',1000,
    [[1250,'g','batata-doce'],[20,'ml','azeite'],[6,'g','sal'],[2,'g','alecrim']],
    ['Lavar, descascar e cortar em cubos; guardar na geladeira coberta com água'],
    [['forno',40,'Assar a 200 °C em assadeira untada, virando na metade']]),
  R('batata_doce_af','Batata-doce na airfryer','carbo',1000,
    [[1250,'g','batata-doce'],[15,'ml','azeite'],[6,'g','sal'],[2,'g','alecrim']],
    ['Lavar, descascar e cortar em cubos; guardar na geladeira coberta com água'],
    [['airfryer',25,'Airfryer a 200 °C, sacudindo na metade']],500),
  R('mandioca','Mandioca cozida','carbo',1000,
    [[1000,'g','mandioca descascada'],[8,'g','sal']],
    ['Descascar e cortar em pedaços (se comprar congelada, pular)'],
    [['fogao',30,'Cozinhar na panela de pressão com água e sal (20 min após pegar pressão)']]),
  R('macarrao_integral','Macarrão integral','carbo',1200,
    [[500,'g','macarrão integral'],[8,'g','sal'],[10,'ml','azeite']],
    [],
    [['fogao',20,'Cozinhar em água fervente com sal, 1 min a menos que a embalagem (vai reaquecer)']]),
  R('pure_batata','Purê de batata','carbo',1000,
    [[1000,'g','batata'],[150,'ml','leite'],[30,'g','manteiga'],[6,'g','sal']],
    ['Descascar e cortar as batatas; guardar cobertas de água na geladeira'],
    [['fogao',25,'Cozinhar as batatas até ficarem macias'],['bancada',10,'Espremer e misturar com leite quente e manteiga']]),

function classe(r){
  const prot=['proteina','jantar','lanche'].includes(r.tipo);
  if(prot && r.grupo) return [r.grupo, r.base||'Outros'];
  if(!prot && r.base) return [r.tipo, r.base];
  const cl=CLASSE[r.id];
  if(cl && (['carbo','legume','cafe','petisco'].includes(cl[0]) !== prot)) return cl;
  if(r.tipo==='cafe') return ['cafe','Outros'];
  if(r.tipo==='petisco') return ['petisco','Petiscos'];
  if(r.tipo==='carbo') return ['carbo', r.base||'Grãos e farofas'];
  if(r.tipo==='legume') return ['legume','Legumes'];
  // receitas novas: adivinha pela proteína dos ingredientes
  const ing=r.ingredientes.map(i=>i.nome.toLowerCase()).join(' ');
  const txt=(r.nome+' '+(r.etapas||[]).map(e=>e.txt).join(' ')).toLowerCase();
  let g='outros';
  if(/frango|sobrecoxa|coxa/.test(ing)) g='frango';
  else if(/til[áa]pia|peixe|salm[ãa]o|camar|atum|bacalhau/.test(ing)) g='peixe';
  else if(/carne|patinho|alcatra|ac[ée]m|lagarto|cupim|costela|maminha|contrafil|m[úu]sculo|cox[ãa]o/.test(ing)) g='carne';
  else if(/lingui|cora[çc][ãa]o|porco|lombo/.test(ing)) g='linguica';
  let b=r.base||'';
  if(!b){
    if(g==='carne') b=/mo[íi]d/.test(ing)?'Carne moída':/desfi|pressão/.test(txt)?'Desfiada e peças':'Cubos e tiras';
    else if(g==='frango') b=/desfi/.test(txt)?'Frango desfiado':/empan|panko/.test(txt+ing)?'Empanado':/assa/.test(txt)?'Assado':'Cubos e filés';
    else if(g==='peixe') b=/empan|panko/.test(txt+ing)?'Empanado':'Grelhado e assado';
    else if(g==='linguica') b='Linguiça e miúdos';
    else b='Outros';
  }
  return [g,b];
}
function rotuloGrupo(g,b){
  const G=GRUPOS.find(x=>x[0]===g);
  return G && G[1] ? G[1]+' · '+b : b;
}
/* ordena e agrupa: grupo → base → nome */
function agrupar(lista){
  const ordemG=g=>{ const i=GRUPOS.findIndex(x=>x[0]===g); return i<0?99:i; };
  const ordemB=(g,b)=>{ const G=GRUPOS.find(x=>x[0]===g); const i=G?G[2].indexOf(b):-1; return i<0?99:i; };
  const map=new Map();
  lista.forEach(r=>{ const [g,b]=classe(r); const k=g+'|'+b; if(!map.has(k)) map.set(k,{g,b,itens:[]}); map.get(k).itens.push(r); });
  return [...map.values()]
    .sort((x,y)=>ordemG(x.g)-ordemG(y.g) || ordemB(x.g,x.b)-ordemB(y.g,y.b) || x.b.localeCompare(y.b))
    .map(x=>({label:rotuloGrupo(x.g,x.b), g:x.g, b:x.b, itens:x.itens.sort((a,c)=>a.nome.localeCompare(c.nome))}));
}
function optsAgrupadas(lista, sel){
  const misto=lista.some(r=>r.tipo==='jantar') && lista.some(r=>r.tipo==='proteina');
  return agrupar(lista).map(gr=>`<optgroup label="${esc(gr.label)}">${gr.itens.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.nome)}${misto&&r.tipo==='jantar'?' (prato completo)':''}</option>`).join('')}</optgroup>`).join('');
}

/* v2: receitas da página “Marmitas” do Notion. Só acrescenta o que falta e
   só troca arroz branco / legumes assados se ainda estiverem como vieram. */
function migrarReceitas(){
  const v=D.receitasVersao||1;
  if(v >= 7) return false;
  receitasNovas7().forEach(r=>{ if(!D.receitas.some(x=>x.id===r.id)) D.receitas.push(r); });
  if(v === 6){ D.receitasVersao=7; return true; }
  if(v === 5){
    // a torta da Dal Bó passa a ser lanche (8 fatias)
    const t=D.receitas.find(r=>r.id==='torta_frango_dalbo');
    if(t && t.tipo==='jantar'){
      t.tipo='lanche';
      if(!/fatias/.test(t.obs||'')) t.obs='Rende 8 fatias. '+(t.obs||'');
      for(const pid in D.semana.combos) D.semana.combos[pid].forEach(c=>{ if(c.proteina===t.id) c.proteina=''; });
      D.semana.jantar.itens=D.semana.jantar.itens.filter(i=>i.rid!==t.id);
    }
    D.receitasVersao=7;
    return true;
  }
  const novas=[...(v<3?receitasLanches():[]), ...(v<4?[...receitasCafe(), ...receitasPetiscos()]:[]), ...receitasNovas5()];
  novas.forEach(r=>{ if(!D.receitas.some(x=>x.id===r.id)) D.receitas.push(r); });
  D.receitasVersao=7;
  if(v >= 2) return true;
  const base=receitasBase();
  [['arroz_branco',ARROZ_BRANCO_VI],['legumes_assados',LEGUMES_FORNO_VI]].forEach(([id,nova])=>{
    const i=D.receitas.findIndex(r=>r.id===id), orig=base.find(r=>r.id===id);
    if(i>=0 && estavel(D.receitas[i])===estavel(orig)) D.receitas[i]=nova();
  });
  receitasVi().forEach(r=>{ if(!D.receitas.some(x=>x.id===r.id)) D.receitas.push(r); });
  return true;
}

/* ============================================================
   SINCRONIZAÇÃO — quando aberto no Claude, os dados ficam na conta
   e aparecem iguais no celular e no computador
   ============================================================ */
const DOCS = {
  receitas: ()=>({lista:D.receitas, versao:D.receitasVersao||1}),
  ajustes:  ()=>({pessoas:D.pessoas, config:D.config}),
  semana:   ()=>({semana:D.semana})
};
let nuvem=null;
const ultimo={}, timers={}, cadeia={}, semeado={};
function estavel(o){
  if(Array.isArray(o)) return '['+o.map(estavel).join(',')+']';
  if(o && typeof o==='object') return '{'+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+estavel(o[k])).join(',')+'}';
  return JSON.stringify(o===undefined?null:o);
}
function setSync(st){
  const el=document.getElementById('syncInfo'); if(!el) return;
  el.textContent = {conectando:'☁️ conectando…', ok:'☁️ sincronizado entre seus aparelhos', salvando:'☁️ salvando…',
    local:'📱 salvo só neste aparelho', erro:'⚠️ não consegui sincronizar agora; suas mudanças continuam neste aparelho'}[st]||'';
}
function agendarEnvio(){
  if(!nuvem) return;
  for(const n in DOCS){
    if(estavel(DOCS[n]())===ultimo[n]) continue;
    clearTimeout(timers[n]);
    timers[n]=setTimeout(()=>{ timers[n]=null; enviar(n); },700);
  }
}
function enviar(n){
  cadeia[n]=(cadeia[n]||Promise.resolve()).then(async()=>{
    const corpo=DOCS[n](), j=estavel(corpo);
    if(j===ultimo[n]) return;
    setSync('salvando');
    const gravar=()=>nuvem.doc('marmitas/'+n).set(JSON.parse(JSON.stringify(corpo)));
    try{ await gravar(); }
    catch(e){
      if(e && e.code==='unavailable'){
        await new Promise(r=>setTimeout(r,800+Math.random()*800));
        try{ await gravar(); }catch(e2){ setSync('erro'); return; }
      } else { setSync('erro'); if(e && e.code==='quota_exceeded') toast('Espaço de armazenamento cheio'); return; }
    }
    ultimo[n]=j; setSync('ok');
  });
}
function aplicar(n,data){
  if(n==='receitas' && Array.isArray(data.lista)){ D.receitas=data.lista; D.receitasVersao=data.versao||1; }
  if(n==='ajustes'){ if(Array.isArray(data.pessoas)) D.pessoas=data.pessoas; if(data.config) D.config=data.config; }
  if(n==='semana' && data.semana) D.semana=data.semana;
  return normalizar();
}
async function conectar(){
  if(!(window.claude && typeof window.claude.use==='function')) return;
  setSync('conectando');
  let db=null;
  try{ db=await window.claude.use('db'); }catch(e){}
  if(!db){ setSync('local'); return; }
  nuvem=db;
  for(const n in DOCS){
    db.doc('marmitas/'+n).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){
        // primeira vez: leva para a conta o que já existe neste aparelho
        if(semeado[n]) return;
        if(!snap.metadata.fromCache){ semeado[n]=true; enviar(n); return; }
        // resposta ainda do cache: confirma direto no servidor antes de enviar
        db.doc('marmitas/'+n).get().then(s2=>{ if(!s2.exists && !semeado[n]){ semeado[n]=true; enviar(n); } }).catch(()=>{});
        return;
      }
      const data=JSON.parse(JSON.stringify(snap.data()));
      const j=estavel(data);
      if(!snap.metadata.fromCache) setSync('ok');
      if(j===ultimo[n] || timers[n]) return;
      ultimo[n]=j;
      if(j===estavel(DOCS[n]())) return;
      if(aplicar(n,data)) save(); else salvarLocal();
      render();
    }, ()=>setSync('erro'));
  }
}

const PLURAL = {'dente':'dentes','maço':'maços','colher (sopa)':'colheres (sopa)','colher (chá)':'colheres (chá)','xícara':'xícaras','lata':'latas','caixa':'caixas','pacote':'pacotes'};
function arred(q,un,compra){
  if(un==='g'||un==='ml'){ if(q<20) return Math.ceil(q); if(q<100) return Math.ceil(q/5)*5; return Math.ceil(q/10)*10; }
  return compra ? Math.ceil(q-0.001) : Math.ceil(q*2-0.001)/2;
}
function fmtQ(q,un,compra){
  if(un==='a gosto') return 'a gosto';
  const v = arred(q,un,compra);
  if(un==='g' && v>=1000) return num(v/1000)+' kg';
  if(un==='ml' && v>=1000) return num(v/1000)+' L';
  if(un==='g'||un==='ml') return num(v)+' '+un;
  return num(v)+' '+(v>1 ? (PLURAL[un]||un) : un);
}
function fmtG(g){ return g>=1000 ? num(Math.round(g/10)/100)+' kg' : Math.round(g)+' g'; }
function hora(min){
  const [h,m] = (D.config.inicio||'08:00').split(':').map(Number);
  const t = (h*60+m+Math.round(min)) % (24*60);
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function dur(min){ min=Math.round(min); return min>=60 ? Math.floor(min/60)+'h'+(min%60?String(min%60).padStart(2,'0'):'') : min+' min'; }
function secaoDe(ing){
  if(ing.secao) return ing.secao;
  const n = ing.nome.toLowerCase();
  if(/palha|molho|massa|macarr|arroz|feij|champignon|ketchup|mostarda|atum|coco|pimenta-do-reino/.test(n)) return 'Mercearia';
  if(/frango|carne|patinho|sobrecoxa|coxa|til[áa]pia|peixe|salm[ãa]o|alcatra|m[úu]sculo|lombo|porco|lingui|fil[ée]|mo[íi]da|peito|cox[ãa]o|ac[ée]m|maminha|fraldinha|atum|camar/.test(n)) return 'Açougue e peixaria';
  if(/p[ãa]o (franc|italiano|artesano|de forma)|^p[ãa]o$|rap10/.test(n)) return 'Padaria';
  if(/burrata|queijo|mu[çcs]+arela|presunto|creme de leite|leite|manteiga|requeij|parmes|iogurte|\bovos?\b|ricota|cream cheese|catupiry|maionese/.test(n)) return 'Frios, laticínios e ovos';
  if(/cebola|alho|tomate|lim[ãa]o|batata|mandioca|aipim|br[óo]colis|abobrinha|cenoura|berinjela|vagem|chuchu|cheiro|salsinha|cebolinha|couve|espinafre|piment[ãa]o|ab[óo]bora|inhame|mandioquinha|beterraba|alface|repolho|quiabo|couve-flor|gengibre|coentro|pepino|manga|abacate|banana|pimenta dedo|morango|ma[çc][ãa]|mam[ãa]o|abacaxi|laranja|\buva|manjeric|tomilho/.test(n)) return 'Hortifrúti';
  return 'Mercearia';
}
function linkify(t){ return esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener" style="color:var(--verde-c)">${u}</a>`); }
function obsHtml(r){ return r.obs?`<div class="muted" style="margin:6px 0;line-height:1.5">📝 ${linkify(r.obs)}</div>`:''; }
function ehAgua(nome){ return /^água\b/i.test(nome.trim()); }

/* ============================================================
   CÁLCULOS
   ============================================================ */
function calcular(){
  const mar={}, jan={}, montagem=[];
  const add=(map,rid,qtd,quem)=>{ if(!rec(rid)) return; map[rid]=map[rid]||{qtd:0,quem:[]}; map[rid].qtd+=qtd; map[rid].quem.push(quem); };
  let total=0;
  D.pessoas.forEach(p=>{
    combosDe(p).forEach(c=>{
      if(!(c.qtd>0)) return;
      total += c.qtd;
      const partes=[];
      COMP.forEach(k=>{
        const r=c[k] && rec(c[k]);
        if(!(p[k]>0) || !r) return;
        if(POR_UNIDADE(r.tipo)){ // prato completo, lanche etc.: 1 por marmita
          const un=UNID(r);
          add(mar,r.id,c.qtd,un==='porções'?{nome:p.nome,n:c.qtd,porcoes:true}:{nome:p.nome,n:c.qtd,un});
          partes.push({k:r.tipo,r,porcao:true,un});
        } else {
          add(mar,r.id,p[k]*c.qtd,{nome:p.nome,n:c.qtd,g:p[k]});
          partes.push({k,r,g:p[k]});
        }
      });
      montagem.push({p,c,partes});
    });
  });
  const J=D.semana.jantar;
  if(J.ativo) J.itens.forEach(it=>{
    const r=rec(it.rid); if(!r) return;
    if(POR_UNIDADE(r.tipo)) add(jan,r.id,J.pessoas,UNID(r)==='porções'?{nome:'Jantar',n:J.pessoas,porcoes:true}:{nome:'Jantar',n:J.pessoas,un:UNID(r)});
    else add(jan,r.id,(it.g||150)*J.pessoas,{nome:'Jantar',n:J.pessoas,g:it.g||150});
  });
  const lan={};
  EXTRAS.forEach(x=>{
    const L=D.semana[x.chave];
    if(L && L.ativo) L.itens.forEach(it=>{ const r=rec(it.rid); if(!r||!(it.qtd>0)) return; add(lan,r.id,it.qtd,{nome:x.plural,n:it.qtd,un:UNID(r)}); });
  });
  return {mar,jan,lan,montagem,total};
}
function fator(r,qtd){
  if(!(r.rende>0)) return 0;
  return POR_UNIDADE(r.tipo) ? qtd/r.rende : qtd*(1+(D.config.margem||0)/100)/r.rende;
}
function escala(r,qtd){ const f=fator(r,qtd); return r.ingredientes.map(i=>Object.assign({},i,{qtd:i.qtd*f})); }
function tudo(c){ return juntar(c.mar,c.jan,c.lan); }
function juntar(...ms){
  const o={};
  ms.forEach(m=>{ for(const k in m){ o[k]=o[k]||{qtd:0,quem:[]}; o[k].qtd+=m[k].qtd; o[k].quem.push(...m[k].quem); } });
  return o;
}
function quantoTxt(r,n){
  if(r.tipo==='jantar') return num(n.qtd)+' porç'+(n.qtd>1?'ões':'ão');
  if(EXTRA(r.tipo)) return num(n.qtd)+' '+EXTRA(r.tipo).un;
  return fmtG(n.qtd)+' pronto';
}

/* Agenda as etapas nos equipamentos (fogão com N bocas, airfryer, forno, bancada) */
function agendar(need, comMontagem, nMarmitas){
  const C=D.config;
  const unidades={
    fogao:Array.from({length:Math.max(0,C.bocas|0)},(_,i)=>'Boca '+(i+1)),
    airfryer:Array.from({length:Math.max(0,C.airfryer|0)},(_,i)=>C.airfryer>1?'Airfryer '+(i+1):'Airfryer'),
    forno:Array.from({length:Math.max(0,C.forno|0)},(_,i)=>C.forno>1?'Forno '+(i+1):'Forno'),
    bancada:['Bancada']
  };
  // cada unidade guarda os intervalos ocupados; a etapa entra no primeiro espaço livre
  const ocup={}; for(const e in unidades) ocup[e]=unidades[e].map(()=>[]);
  const encaixe=(iv,t,d)=>{ let s=t; for(const [a,b] of iv){ if(s+d<=a) break; if(b>s) s=b; } return s; };
  const avisos=[];
  const cadeias=Object.keys(need).map(rid=>{
    const r=rec(rid), n=need[rid];
    const gProntos = r.tipo==='jantar' ? 0 : EXTRA(r.tipo) ? n.qtd : n.qtd*(1+(C.margem||0)/100);
    const passos=(r.etapas||[]).map((e,i)=>{
      let lotes=1;
      if(e.eq==='airfryer' && r.lote>0 && gProntos>0) lotes=Math.max(1,Math.ceil(gProntos/r.lote));
      return {r,i,eq:e.eq,txt:e.txt,lotes,dur:(+e.min||0)*lotes};
    }).filter(s=>s.dur>0);
    return {r,passos,total:passos.reduce((a,s)=>a+s.dur,0)};
  }).sort((a,b)=>b.total-a.total);

  const out=[];
  cadeias.forEach(ch=>{
    let t=0;
    ch.passos.forEach(s=>{
      let eq=s.eq;
      if(!ocup[eq] || !ocup[eq].length){ avisos.push(`“${ch.r.nome}” usa ${EQUIP[eq]?EQUIP[eq].nome:eq}, mas não há esse equipamento nos Ajustes — coloquei na bancada.`); eq='bancada'; }
      const arr=ocup[eq];
      let bi=0, start=encaixe(arr[0],t,s.dur);
      for(let i=1;i<arr.length;i++){ const st=encaixe(arr[i],t,s.dur); if(st<start){ start=st; bi=i; } }
      const end=start+s.dur;
      arr[bi].push([start,end]); arr[bi].sort((a,b)=>a[0]-b[0]); t=end;
      out.push(Object.assign({},s,{eq,start,end,lane:unidades[eq][bi],key:ch.r.id+'|'+s.i}));
    });
  });
  let fim=out.reduce((a,s)=>Math.max(a,s.end),0);
  if(comMontagem && nMarmitas>0){
    const d=Math.max(15,Math.ceil(nMarmitas*1.5));
    const fimMarm=out.filter(s=>!POR_UNIDADE(s.r.tipo)).reduce((a,s)=>Math.max(a,s.end),0);
    const ini=encaixe(ocup.bancada[0],fimMarm,d);
    out.push({montagem:true,eq:'bancada',lane:'Bancada',start:ini,end:ini+d,dur:d,key:'montagem',
      txt:`Deixar amornar (no máx. 2 h fora da geladeira), porcionar ${nMarmitas} marmitas na balança, tampar, etiquetar e levar para geladeira/freezer`});
    fim=Math.max(fim,ini+d);
  }
  out.sort((a,b)=>a.start-b.start||a.lane.localeCompare(b.lane));
  const lanes=[...unidades.fogao,...unidades.airfryer,...unidades.forno,'Bancada'];
  return {passos:out,fim,lanes,avisos:[...new Set(avisos)]};
}

/* qualquer receita pode ir em qualquer lugar: primeiro as do próprio tipo,
   depois “outras receitas”, separadas por tipo */
const ORDEM_TIPOS=['proteina','jantar','carbo','legume','lanche','cafe','petisco'];
function opcoesTodas(principais, sel, vazio){
  let h=`<option value="">${vazio||'— escolher —'}</option>`+optsAgrupadas(D.receitas.filter(r=>principais.includes(r.tipo)), sel);
  const resto=D.receitas.filter(r=>!principais.includes(r.tipo));
  const prox = principais.includes('legume') ? ['carbo'] : principais.includes('carbo') ? ['legume'] : [];
  [...prox, ...ORDEM_TIPOS.filter(t=>!prox.includes(t))].filter(t=>!principais.includes(t)).forEach(t=>{
    agrupar(resto.filter(r=>r.tipo===t)).forEach(gr=>{
      const nomeT=t==='jantar'?'Prato completo':NOME_TIPO(t);
      h+=`<optgroup label="Outras · ${esc(nomeT)} · ${esc(gr.label.replace(/^[^\p{L}]+/u,''))}">${gr.itens.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.nome)}</option>`).join('')}</optgroup>`;
    });
  });
  return h;
}
function opcoesReceita(tipo, sel, vazio){
  // na proteína entram também os pratos completos, no grupo da mesma base
  return opcoesTodas(tipo==='proteina'?['proteina','jantar']:[tipo], sel, vazio);
}

        else if(rk && rk.tipo!==k) h+=`<div class="muted" style="margin:4px 0 0 70px">${p[k]} g por marmita.</div>`;

  }
  return h;
}
function stepCombo(pid,cid,d){ const cb=combosDe(pessoa(pid)).find(x=>x.id===cid); cb.qtd=Math.max(0,(+cb.qtd||0)+d); save(); render(); }
function setCombo(pid,cid,k,v){ const cb=combosDe(pessoa(pid)).find(x=>x.id===cid); cb[k]=v; save(); render(); }
function addCombo(pid){
  const p=pessoa(pid), cs=combosDe(p);
  const base=cs[cs.length-1];
  const metade=Math.floor((+base.qtd||0)/2);
  base.qtd-=metade;
  cs.push({id:uid(),proteina:'',carbo:base.carbo||'',legume:base.legume||'',qtd:metade});
  save(); render();
}
function rmCombo(pid,cid){
  const cs=combosDe(pessoa(pid)); const i=cs.findIndex(x=>x.id===cid);
  const [rm]=cs.splice(i,1); cs[Math.max(0,i-1)].qtd+= (+rm.qtd||0);

/* ============================================================
   PÁGINA: COMPRAS
   ============================================================ */
function listaCompras(c){
  const need=tudo(c), itens={};
  Object.keys(need).forEach(rid=>{
    const r=rec(rid);
    escala(r,need[rid].qtd).forEach(i=>{
      if(ehAgua(i.nome)) return;
      const k=i.nome.trim().toLowerCase()+'|'+i.un;
      if(!itens[k]) itens[k]={k,nome:i.nome.trim(),un:i.un,qtd:0,secao:secaoDe(i),usos:[]};
      itens[k].qtd+=i.qtd;
      if(!itens[k].usos.includes(r.nome)) itens[k].usos.push(r.nome);
    });
  });
  (D.semana.extras||[]).forEach((e,i)=>{ const k='extra|'+i; itens[k]={k,nome:e,un:'',qtd:0,secao:'Outros',usos:[],extra:i}; });
  return Object.values(itens);
}
function pgCompras(c){
  const itens=listaCompras(c);
  const comp=D.semana.compradas||{};
  const falta=itens.filter(i=>!comp[i.k]).length;
  let h=`<div class="sec-t">Lista de compras</div>
    <div class="sec-s">Toque para marcar o que já tem em casa ou já comprou. Faltam <b>${falta}</b> de ${itens.length} itens.</div>
    <div class="row wrap no-print" style="margin-bottom:14px">
      <button class="btn" onclick="compartilharCompras()">📋 Copiar lista (para WhatsApp)</button>
    </div>`;
  if(!itens.length) return h+`<div class="empty">Escolha receitas na aba Semana para gerar a lista.</div>`;
  SECOES.forEach(s=>{
    const doS=itens.filter(i=>i.secao===s).sort((a,b)=>a.nome.localeCompare(b.nome));
    if(!doS.length) return;
    h+=`<div class="card white"><div class="card-t" style="margin-bottom:4px">${s}</div>`;
    doS.forEach(i=>{
      h+=`<div class="chk ${comp[i.k]?'done':''}" onclick="togCompra('${encK(i.k)}')">
        <div class="box"></div>
        <div class="txt">${i.un?`<span class="q">${fmtQ(i.qtd,i.un,true)}</span> `:''}${esc(i.nome)}
          ${i.usos.length?`<div class="sub">${i.usos.map(esc).join(', ')}</div>`:''}</div>
        ${i.extra!=null?`<button class="x" onclick="event.stopPropagation();rmExtra(${i.extra})">×</button>`:''}
      </div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="card no-print"><div class="lbl" style="margin-top:0">Adicionar item avulso</div>
    <div class="row"><input class="inp" id="extraInp" placeholder="ex.: potes de vidro, frutas, ovos..." onkeydown="if(event.key==='Enter')addExtra()"><button class="btn" onclick="addExtra()">+</button></div></div>`;
  return h;
}
function encK(k){ return encodeURIComponent(k).replace(/'/g,'%27'); }
function togCompra(k){ k=decodeURIComponent(k); const c=D.semana.compradas; if(c[k]) delete c[k]; else c[k]=1; save(); render(); }
function addExtra(){ const v=document.getElementById('extraInp').value.trim(); if(!v) return; D.semana.extras.push(v); save(); render(); }
function rmExtra(i){ D.semana.extras.splice(i,1); const c=D.semana.compradas; delete c['extra|'+i]; save(); render(); }
function compartilharCompras(){
  const itens=listaCompras(calcular()).filter(i=>!D.semana.compradas[i.k]);
  let t='🛒 *Lista de compras — marmitas*\n';
  SECOES.forEach(s=>{
    const doS=itens.filter(i=>i.secao===s).sort((a,b)=>a.nome.localeCompare(b.nome));
    if(!doS.length) return;
    t+=`\n*${s}*\n`+doS.map(i=>'• '+(i.un?fmtQ(i.qtd,i.un,true)+' ':'')+i.nome).join('\n')+'\n';
  });
  copiar(t,'Lista copiada 📋');
}
function copiar(t,msg){
  const manual=()=>caixaTexto('Selecione e copie o texto abaixo:',t);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(()=>toast(msg),manual);
    else manual();
  }catch(e){ manual(); }
}

   PÁGINA: VÉSPERA (pré-preparo)

function chkHtml(key,conteudo){
  const done=D.semana.checks[key];
  return `<div class="chk ${done?'done':''}" onclick="togChk('${key}')"><div class="box"></div><div class="txt">${conteudo}</div></div>`;
}
function togChk(k){ const c=D.semana.checks; if(c[k]) delete c[k]; else c[k]=1; save(); render(); }

function pgVespera(c){
  const need=tudo(c);
  const ids=Object.keys(need);
  const J=D.semana.jantar;
  let h=`<div class="sec-t">${esc(D.config.diaPre)} · pré-preparo</div>
    <div class="sec-s">Tudo o que dá para adiantar no dia anterior, para o dia do preparo render.</div>`;
  if(!ids.length) return h+`<div class="empty">Escolha receitas na aba Semana.</div>`;

  const temCongelado = ids.some(id=>{ const t=rec(id).tipo; return t==='proteina' || t==='jantar' || t==='lanche'; });
  const potes = c.total;
  h+=`<div class="card white"><div class="card-t" style="margin-bottom:4px">Geral</div>
    ${chkHtml('pre|potes',`Separar e higienizar <span class="q">${potes} potes</span> de marmita${J.ativo&&!J.junto?'':''}`)}
    ${temCongelado?chkHtml('pre|desc','Passar as proteínas congeladas do freezer para a geladeira'):''}
    ${chkHtml('pre|etiq','Preparar etiquetas (nome + data de preparo)')}
    ${chkHtml('pre|bal','Conferir balança de cozinha, assadeiras e cesto da airfryer limpos')}
  </div>`;

  // bases em comum: preparar uma vez e dividir
  const bases=agrupar(ids.map(rec)).filter(gr=>gr.itens.length>1 && !['carbo','legume','outros','cafe','petisco'].includes(gr.g));
  if(bases.length){
    h+=`<div class="card"><div class="card-t" style="margin-bottom:4px">Bases em comum</div>
      <div class="muted" style="margin-bottom:6px">Prepare a base de uma vez e depois divida entre as receitas.</div>`;
    bases.forEach(gr=>{
      const princ={};
      const RX={carne:/carne|patinho|alcatra|ac[ée]m|lagarto|cupim|costela|contrafil|maminha/i, frango:/frango|sobrecoxa|coxa/i, peixe:/til[áa]pia|peixe|salm|camar|atum/i, linguica:/lingui|cora[çc]/i}[gr.g];
      gr.itens.forEach(r=>escala(r,need[r.id].qtd).forEach(i=>{
        if(i.un!=='g' || !RX || !RX.test(i.nome)) return;
        if(gr.b==='Carne moída' && !/mo[íi]d/i.test(i.nome)) return;
        princ[i.nome]=(princ[i.nome]||0)+i.qtd;
      }));
      h+=chkHtml('pre|base|'+gr.g+'|'+gr.b, `<b>${esc(gr.label)}</b>: ${Object.entries(princ).map(([k,q])=>`<span class="q">${fmtQ(q,'g')}</span> ${esc(k)}`).join(' + ')}
        <div class="sub">para ${gr.itens.map(r=>esc(r.nome)).join(', ')}</div>`);
    });
    h+=`</div>`;
  }

  const ordem=['proteina','carbo','legume','jantar','lanche','cafe','petisco'];
  const sem=[];
  ordem.forEach(t=>ids.filter(id=>rec(id).tipo===t).forEach(id=>{
    const r=rec(id), n=need[id];
    if(!(r.pre||[]).length){ sem.push(r.nome); return; }
    const ings=escala(r,n.qtd).filter(i=>!ehAgua(i.nome));
    h+=`<div class="card white">
      <div class="card-h" style="margin-bottom:4px"><span class="dot ${r.tipo}"></span><div class="card-t">${esc(r.nome)}</div><span class="muted ml-auto">${quantoTxt(r,n)}</span></div>
      <div class="ing-list">${ings.map(i=>`<div><b>${fmtQ(i.qtd,i.un)}</b> ${esc(i.nome)}</div>`).join('')}</div>
      ${obsHtml(r)}
      ${r.pre.map((p,i)=>chkHtml('pre|'+r.id+'|'+i,esc(p))).join('')}
    </div>`;
  }));
  if(sem.length) h+=`<div class="muted" style="padding:0 4px">Sem pré-preparo: ${sem.map(esc).join(', ')}.</div>`;
  return h;
}

/* ============================================================
   PÁGINA: DIA DO PREPARO
   ============================================================ */
function ganttHtml(ag){
  if(!ag.passos.length) return '';
  const total=Math.max(ag.fim,1);
  const usadas=new Set(ag.passos.map(s=>s.lane));
  const lanes=ag.lanes.filter(l=>usadas.has(l) || l.startsWith('Boca'));
  let h=`<div class="gantt">`;
  lanes.forEach(l=>{
    h+=`<div class="g-lane"><div class="g-name">${esc(l)}</div><div class="g-track">`;
    ag.passos.filter(s=>s.lane===l).forEach(s=>{
      const cls=s.montagem?'montagem':s.r.tipo;
      const nm=s.montagem?'Montagem':s.r.nome;
      h+=`<div class="g-bar ${cls}" style="left:${s.start/total*100}%;width:${(s.end-s.start)/total*100}%" title="${esc(nm)} · ${hora(s.start)}–${hora(s.end)}">${esc(nm)}</div>`;
    });
    h+=`</div></div>`;
  });
  const passo = total>240?60:30;
  h+=`<div class="g-axis">`;
  for(let m=0;m<=total;m+=passo) h+=`<span class="g-tick" style="left:${m/total*100}%">${hora(m)}</span>`;
  h+=`</div></div>`;
  return h;
}
function timelineHtml(ag,pref){
  return `<div class="card white">${ag.passos.map(s=>{
    const nm=s.montagem?'Montagem das marmitas':s.r.nome;
    const eq=EQUIP[s.eq];
    const lotes=s.lotes>1?` · <b>${s.lotes} levas</b>`:'';
    return chkHtml(pref+s.key,`<div class="row" style="align-items:flex-start;gap:10px">
      <span class="tl-time">${hora(s.start)}–${hora(s.end)}</span>
      <span style="flex:1"><b>${esc(nm)}</b> <span class="tl-eq">${eq.icon} ${esc(s.lane)} · ${dur(s.dur)}${lotes}</span>
      <div class="sub" style="font-size:12px;color:var(--texto-s)">${esc(s.txt)}</div></span></div>`);
  }).join('')}</div>`;
}
function pgPreparo(c){
  const J=D.semana.jantar;
  const juntos=J.ativo && J.junto;
  const needDia = juntos ? tudo(c) : juntar(c.mar,c.lan);
  const ag=agendar(needDia,true,c.total);
  let h=`<div class="sec-t">${esc(D.config.diaPrep)} · preparo</div>
    <div class="sec-s">Cronograma montado para ${D.config.bocas} bocas, ${D.config.airfryer} airfryer e ${D.config.forno} forno, começando pelo que demora mais.</div>
    <div class="row no-print" style="margin-bottom:12px"><span class="muted">Começo às</span>
      <input class="inp sm" type="time" value="${esc(D.config.inicio)}" onchange="D.config.inicio=this.value;save();render()" style="width:110px">
      ${ag.passos.length?`<span class="muted ml-auto">término ~<b style="color:var(--verde)">${hora(ag.fim)}</b> (${dur(ag.fim)})</span>`:''}</div>`;
  if(!ag.passos.length) return h+`<div class="empty">Escolha receitas na aba Semana.</div>`;
  ag.avisos.forEach(a=>h+=`<div class="warn">${esc(a)}</div>`);
  h+=ganttHtml(ag)+timelineHtml(ag,'dia|');

  // Quantidades por receita (para conferir durante o preparo)
  h+=`<div class="sec-t" style="margin-top:20px">Ingredientes de cada receita</div>`;
  Object.keys(needDia).forEach(id=>{
    const r=rec(id), n=needDia[id];
    h+=`<details class="card white"><summary class="row" style="cursor:pointer"><span class="dot ${r.tipo}"></span><b style="flex:1">${esc(r.nome)}</b><span class="muted">${quantoTxt(r,n)}</span></summary>
      <div class="ing-list" style="margin-top:8px">${escala(r,n.qtd).map(i=>`<div><b>${fmtQ(i.qtd,i.un)}</b> ${esc(i.nome)}</div>`).join('')}</div>${obsHtml(r)}</details>`;
  });

  // Montagem
  h+=`<div class="sec-t" style="margin-top:20px">Montagem das marmitas</div>
    <div class="sec-s">Porcione com balança. Total: <b>${c.total} marmitas</b>.</div>
    <div class="card white"><table class="mt"><tr><th>Quem</th><th>Conteúdo</th><th style="text-align:right">Qtd</th></tr>`;
  c.montagem.forEach(m=>{
    h+=`<tr><td>${esc(m.p.emoji||'')} ${esc(m.p.nome)}</td>
      <td>${m.partes.length?m.partes.map(x=>`<div><span class="dot ${x.k}" style="display:inline-block;margin-right:5px"></span>${x.porcao?(x.un==='un'?'1 un':'1 porção'):x.g+'g'} ${esc(x.r.nome)}</div>`).join(''):'<span class="muted">nenhuma receita escolhida</span>'}</td>
      <td class="n">${m.c.qtd}×</td></tr>`;
  });
  h+=`</table></div>
    <div class="card"><div class="card-t" style="font-size:18px;margin-bottom:6px">Dicas de conservação</div>
      <div style="font-size:13px;line-height:1.6">• Geladeira: consumir em até 3–4 dias. Para o resto da semana, congele.<br>
      • Legumes ficam melhores levemente al dente — terminam de cozinhar ao reaquecer.<br>
      • Não deixe a comida mais de 2 h em temperatura ambiente antes de refrigerar.</div></div>`;

  if(J.ativo && !J.junto){
    const agJ=agendar(c.jan,false,0);
    h+=`<div class="sec-t" style="margin-top:20px">🍽️ Jantar especial (${J.pessoas} pessoas)</div>
      <div class="sec-s">Cronograma separado — horários contados a partir de ${esc(D.config.inicio)}; ajuste mentalmente para a hora do jantar.</div>`;
    if(agJ.passos.length){ agJ.avisos.forEach(a=>h+=`<div class="warn">${esc(a)}</div>`); h+=ganttHtml(agJ)+timelineHtml(agJ,'jan|'); }
    else h+=`<div class="empty">Escolha o prato do jantar na aba Semana.</div>`;
  }
  return h;
}

    h+=`<div class="ed-row">
      <input class="inp xs" type="number" inputmode="decimal" step="any" value="${i.qtd}" onchange="ED.ingredientes[${k}].qtd=+this.value" ${i.un==='a gosto'?'disabled':''}>
      <select class="inp" style="width:92px;flex:0 0 92px" onchange="ED.ingredientes[${k}].un=this.value;render()">${UNIDADES.map(u=>`<option ${u===i.un?'selected':''}>${u}</option>`).join('')}</select>
      <input class="inp" value="${esc(i.nome)}" placeholder="ingrediente" onchange="ED.ingredientes[${k}].nome=this.value">
      <button class="x" onclick="ED.ingredientes.splice(${k},1);render()">×</button></div>`;
  });
  h+=`<button class="btn ghost sm" onclick="ED.ingredientes.push({qtd:'',un:'g',nome:'',secao:''});render()">+ ingrediente</button></div>
  <div class="card"><div class="card-t" style="margin-bottom:4px">Observações e links</div>
    <textarea class="inp" style="min-height:60px" placeholder="dicas, link do vídeo, de onde é a receita..." onchange="ED.obs=this.value">${esc(r.obs||'')}</textarea></div>
  <div class="card"><div class="card-t" style="margin-bottom:4px">Pré-preparo (véspera)</div>
    <div class="muted" style="margin-bottom:8px">Uma tarefa por linha. Ex.: marinar, descongelar, picar, deixar de molho.</div>
    <textarea class="inp" onchange="ED.pre=this.value.split('\\n').map(s=>s.trim()).filter(Boolean)">${esc((r.pre||[]).join('\n'))}</textarea></div>
  <div class="card"><div class="card-t" style="margin-bottom:4px">Etapas do preparo</div>
    <div class="muted" style="margin-bottom:8px">Em ordem. O equipamento e o tempo são usados para montar o cronograma do dia.</div>`;
  (r.etapas||[]).forEach((e,k)=>{
    h+=`<div class="combo"><div class="ed-row">
      <select class="inp" onchange="ED.etapas[${k}].eq=this.value;render()">${Object.keys(EQUIP).map(q=>`<option value="${q}" ${q===e.eq?'selected':''}>${EQUIP[q].icon} ${EQUIP[q].nome}</option>`).join('')}</select>
      <input class="inp xs" type="number" inputmode="numeric" value="${e.min}" onchange="ED.etapas[${k}].min=+this.value"><span class="muted">min</span>
      <button class="x" onclick="ED.etapas.splice(${k},1);render()">×</button></div>
      <input class="inp" value="${esc(e.txt)}" placeholder="o que fazer" onchange="ED.etapas[${k}].txt=this.value"></div>`;
  });
  h+=`<button class="btn ghost sm" onclick="ED.etapas.push({eq:'fogao',min:15,txt:''});render()">+ etapa</button></div>
  <div class="row wrap" style="margin-top:6px">
    <button class="btn" onclick="salvarReceita()">Salvar receita</button>
    ${r.id?`<button class="btn sec" onclick="duplicarReceita()">Duplicar</button><button class="btn danger ml-auto" onclick="apagarReceita()">Apagar</button>`:''}
  </div>`;
  return h;
}
function salvarReceita(){
  // garante que o campo em foco seja lido antes de salvar
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const r=ED;
  if(!r.nome.trim()){ toast('Dê um nome à receita'); return; }
  if(!(r.rende>0)){ toast('Informe quanto a receita rende'); return; }
  r.ingredientes=r.ingredientes.filter(i=>i.nome.trim()).map(i=>Object.assign(i,{nome:i.nome.trim(),qtd:+i.qtd||0}));
  r.etapas=(r.etapas||[]).filter(e=>(+e.min>0)||e.txt.trim());
  if(!r.id){ r.id=uid(); D.receitas.push(r); }
  else{ const i=D.receitas.findIndex(x=>x.id===r.id); D.receitas[i]=r; }
  ED=null; save(); render(); toast('Receita salva ✓');
}
function duplicarReceita(){ ED=JSON.parse(JSON.stringify(ED)); ED.id=''; ED.nome+=' (cópia)'; render(); toast('Cópia criada — edite e salve'); }
function apagarReceita(){
  pedir(`Apagar “${ED.nome}”?`,()=>{
    const id=ED.id;
    D.receitas=D.receitas.filter(r=>r.id!==id);
    for(const pid in D.semana.combos) D.semana.combos[pid].forEach(c=>COMP.forEach(k=>{ if(c[k]===id) c[k]=''; }));
    D.semana.jantar.itens=D.semana.jantar.itens.filter(i=>i.rid!==id);
    ED=null; save(); render(); toast('Receita apagada');
  },'Apagar');
}

/* ============================================================
   PÁGINA: AJUSTES
   ============================================================ */
function pgAjustes(){
  const C=D.config;
  let h=`<div class="sec-t">Pessoas e porções</div>
    <div class="sec-s">Gramas por marmita (pesadas prontas). Coloque 0 para não incluir aquele componente.</div>`;
  D.pessoas.forEach(p=>{
    h+=`<div class="card">
      <div class="row" style="margin-bottom:8px">
        <input class="inp" style="width:54px;text-align:center;font-size:20px;padding:5px" value="${esc(p.emoji||'')}" onchange="setP('${p.id}','emoji',this.value)">
        <input class="inp" value="${esc(p.nome)}" onchange="setP('${p.id}','nome',this.value)">
        <button class="x" onclick="rmPessoa('${p.id}')">×</button>
      </div>
      <div class="grid2" style="grid-template-columns:repeat(4,1fr)">
        <div><label class="lbl">Marmitas</label><input class="inp" type="number" inputmode="numeric" value="${p.qtd}" onchange="setP('${p.id}','qtd',+this.value)"></div>
        <div><label class="lbl">Proteína g</label><input class="inp" type="number" inputmode="numeric" value="${p.proteina}" onchange="setP('${p.id}','proteina',+this.value)"></div>
        <div><label class="lbl">Carbo g</label><input class="inp" type="number" inputmode="numeric" value="${p.carbo}" onchange="setP('${p.id}','carbo',+this.value)"></div>
        <div><label class="lbl">Legumes g</label><input class="inp" type="number" inputmode="numeric" value="${p.legume}" onchange="setP('${p.id}','legume',+this.value)"></div>
      </div></div>`;
  });
  h+=`<button class="btn ghost" onclick="addPessoa()">+ adicionar pessoa</button>

  <div class="sec-t" style="margin-top:22px">Cozinha</div>
  <div class="card"><div class="grid3">
    <div><label class="lbl" style="margin-top:0">🔥 Bocas</label><input class="inp" type="number" inputmode="numeric" value="${C.bocas}" onchange="setC('bocas',+this.value)"></div>
    <div><label class="lbl" style="margin-top:0">💨 Airfryers</label><input class="inp" type="number" inputmode="numeric" value="${C.airfryer}" onchange="setC('airfryer',+this.value)"></div>
    <div><label class="lbl" style="margin-top:0">♨️ Fornos</label><input class="inp" type="number" inputmode="numeric" value="${C.forno}" onchange="setC('forno',+this.value)"></div>
  </div>
  <div class="grid3">
    <div><label class="lbl">Início do preparo</label><input class="inp" type="time" value="${esc(C.inicio)}" onchange="setC('inicio',this.value)"></div>
    <div><label class="lbl">Margem %</label><input class="inp" type="number" inputmode="numeric" value="${C.margem}" onchange="setC('margem',+this.value)"></div>
  </div>
  <div class="grid2">
    <div><label class="lbl">Dia do pré-preparo</label><input class="inp" value="${esc(C.diaPre)}" onchange="setC('diaPre',this.value)"></div>
    <div><label class="lbl">Dia do preparo</label><input class="inp" value="${esc(C.diaPrep)}" onchange="setC('diaPrep',this.value)"></div>
  </div>
  <div class="muted" style="margin-top:8px">A margem compensa perdas e variação no rendimento (sobra um pouco a mais).</div></div>

  <div class="sec-t" style="margin-top:22px">Backup</div>
  <div class="card">
    <div class="muted" style="margin-bottom:10px">${nuvem?'Seus dados ficam salvos na sua conta e aparecem iguais em todos os aparelhos onde você abrir este link. O backup serve como cópia de segurança.':'Os dados ficam salvos neste navegador. Copie o backup para guardar ou levar para outro aparelho.'}</div>
    <div class="row wrap"><button class="btn" onclick="copiar(JSON.stringify(D),'Backup copiado 📋')">Copiar backup</button>
    <button class="btn sec" onclick="importar()">Restaurar backup</button>
    <button class="btn sec" onclick="restaurarPadrao()">Repor receitas de exemplo</button></div>
  </div>`;
  return h;
}
function setP(id,k,v){
  const p=pessoa(id);
  if(k==='qtd'){ v=Math.max(0,v|0); const cs=combosDe(p); if(cs.length===1) cs[0].qtd=v; }
  if(['proteina','carbo','legume'].includes(k)) v=Math.max(0,v||0);
  p[k]=v; save(); render();
}
function addPessoa(){ const p={id:uid(),nome:'Nova pessoa',emoji:'🙂',qtd:5,proteina:120,carbo:120,legume:100}; D.pessoas.push(p); save(); render(); }
function rmPessoa(id){
  const p=pessoa(id);
  pedir(`Remover ${p.nome}?`,()=>{ D.pessoas=D.pessoas.filter(x=>x.id!==id); delete D.semana.combos[id]; save(); render(); },'Remover');
}
function setC(k,v){ if(typeof v==='number') v=Math.max(0,v||0); D.config[k]=v; save(); render(); }
function importar(){
  caixaTexto('Cole aqui o backup copiado antes:','',t=>{
    try{ const d=JSON.parse(t); if(!d.receitas||!d.pessoas) throw 0; D=d; save(); load(); render(); toast('Backup restaurado ✓'); }
    catch(e){ toast('Backup inválido: cole o texto completo'); }
  },'Restaurar');
}
function restaurarPadrao(){
  const faltando=receitasPadrao().filter(r=>!rec(r.id));
  if(!faltando.length){ toast('Todas as receitas de exemplo já estão aqui'); return; }
  D.receitas.push(...faltando); save(); render(); toast(faltando.length+' receitas repostas');
}

load(); render(); conectar();
</script>
</body>
</html>
